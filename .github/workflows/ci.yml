name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    # macos-latest, not ubuntu-latest: test/e2e/compilation.test.ts actually
    # `swift build`s the generated apps against SwiftUI, which only exists on
    # Apple platforms. Linux ships a swift(1) binary with no SwiftUI, so the
    # existing `hasSwift` test gate doesn't skip there and 7 "Compilation
    # Guarantee" tests fail — not a code regression, a wrong-OS runner.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test --coverage
        env:
          MORPHKIT_NO_AI: "1"
